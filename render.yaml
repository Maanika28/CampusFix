services:
  # 1. Django Backend Web Service
  - type: web
    name: campusfix-backend
    runtime: python
    rootDir: backend
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campusfix-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: PYTHON_VERSION
        value: 3.11.9

  # 2. React Vite Frontend Static Site
  - type: web
    name: campusfix-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: campusfix-backend
          envVarKey: RENDER_EXTERNAL_URL

databases:
  # 3. PostgreSQL Managed Database
  - name: campusfix-db
    databaseName: campusfix_db
    user: campusfix
    plan: free
